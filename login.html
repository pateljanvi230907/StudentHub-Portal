<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Portal - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F0F9FF;
            color: #172033;
        }

        header {
            background-color: #1E3A8A;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        hr {
            border: 0;
            height: 1px;
            background-color: #38BDF8;
        }

        main {
            padding: 30px;
        }

        table {
            background-color: #FFFFFF;
            border-radius: 12px;
        }

        td {
            padding: 30px;
        }

        h2 {
            color: #1E3A8A;
        }

        h3 {
            color: #0F766E;
        }

        fieldset {
            border: 2px solid #38BDF8;
            border-radius: 10px;
            padding: 25px;
            background-color: #FFFFFF;
        }

        legend {
            color: #1E3A8A;
            font-weight: bold;
            padding: 5px 10px;
        }

        label {
            font-weight: bold;
            color: #172033;
        }

        input[type="email"],
        input[type="password"] {
            width: 90%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #94A3B8;
            border-radius: 6px;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border: 2px solid #38BDF8;
        }

        input[type="submit"] {
            background-color: #1E3A8A;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #0F766E;
        }

        a {
            color: #1E3A8A;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #0F766E;
            text-decoration: underline;
        }

        img {
            border-radius: 12px;
        }

        footer {
            background-color: #1E3A8A;
            color: white;
            padding: 15px;
        }

        footer p {
            margin: 0;
        }
    </style>
   
</head>

<body>

    <header>
        <h1 align="center">StudentHub Portal</h1>
        <hr>
    </header>

    <main>
        <table width="100%" cellpadding="20">
            <tr>
                <td width="45%" valign="top">
                    <h2>Login</h2>

                    <form action="login.php" method="POST" autocomplete="on">
                        <fieldset>
                            <legend>Student Login</legend>

                            <p>
                                <label for="email">Email</label><br>
                                <input type="email" id="email" name="email"
                                    placeholder="Enter Email"
                                    required autocomplete="email">
                            </p>

                            <p>
                                <label for="password">Password</label><br>
                                <input type="password" id="password" name="password"
                                    placeholder="Enter Password"
                                    required minlength="8">
                            </p>

                            <p>
                                <input type="checkbox" id="remember">
                                <label for="remember">Remember Me</label>
                            </p>

                            <p>
                                <input type="submit" value="Login">
                            </p>

                            <p>
                                <a href="#">Forgot Password?</a>
                            </p>

                            <center>
                                <big>OR</big><br>
                                <a href="signupPage.html">sign up</a>
                            </center>

                        </fieldset>
                    </form>
                </td>

                <td width="55%" align="center">
                    <h2>Welcome to StudentHub</h2>

                    <p>
                        StudentHub helps students manage courses, attendance,
                        assignments, events and profile in one place.
                    </p>

                    <img src="https://images.openai.com/static-rsc-4/hH32RD1yXkib3Uxc2afr_NIFLWB8fARs73EqJ0JK6ByDmY5fPuPPpBXzBU22mM4OJbcRuk6wxnAs-EOIslVR7lzJqnCicdUUnVUN-onjIrJcOiOZXMPAC-X5sa00ZSCgipzc4XPkMXGPsL1irIPS6RaMEBtiG03Fp_1cqigiN0Ns2H6Z97-ONuMijguGchRC?purpose=fullsize"
                        alt="StudentHub"
                        width="350"
                        height="350">

                    <br><br>

                    <h3>Learn • Grow • Succeed</h3>
                </td>
            </tr>
        </table>
    </main>

    <hr>

    <footer align="center">
        <p>
            &copy 2026 StudentHub Portal
        </p>
    </footer>

</body>
</html>
