<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F0F9FF;
            color: #172033;
        }

        header {
            background-color: #1E3A8A;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        hr {
            border: 0;
            height: 1px;
            background-color: #38BDF8;
        }

        main {
            padding: 40px;
            min-height: 400px;
        }

        form {
            width: 500px;
        }

        fieldset {
            border: 2px solid #38BDF8;
            border-radius: 12px;
            padding: 30px;
            background-color: #FFFFFF;
        }

        legend {
            color: #1E3A8A;
            font-size: 20px;
            padding: 5px 10px;
        }

        label {
            font-weight: bold;
            color: #172033;
        }

        input[type="text"],
        input[type="password"] {
            width: 250px;
            padding: 10px;
            margin-left: 10px;
            border: 1px solid #94A3B8;
            border-radius: 6px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border: 2px solid #38BDF8;
        }

        input[type="submit"] {
            background-color: #1E3A8A;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #0F766E;
        }

        footer {
            background-color: #1E3A8A;
            color: white;
            padding: 15px;
        }

        footer p {
            margin: 0;
        }
    </style>
    
</head>

<body>

    <header>
        <h1 align="center">Student Registration</h1>
        <hr>
    </header>

    <main>
        <center>
            <form action="process_registration.php" method="post" autocomplete="on">
                <fieldset>

                    <legend><b>Sign up</b></legend>

                    <label for="username">Username</label>
                    <input type="text"
                        id="username"
                        name="username"
                        placeholder="Enter Username"
                        required>
                    <br><br>

                    <label for="password">Password</label>
                    <input type="password"
                        id="password"
                        name="password"
                        placeholder="Enter Password"
                        minlength="8"
                        required>
                    <br><br>

                    <label for="confirm">Confirm Password</label>
                    <input type="password"
                        id="confirm"
                        name="confirm"
                        placeholder="Confirm Password"
                        minlength="8"
                        required>
                    <br><br>

                    <input type="submit"
                        id="submit"
                        value="Sign in">

                </fieldset>
            </form>
        </center>
    </main>

    <footer>
        <hr>
        <center>
            <p>&copy 2026 StudentHub Portal</p>
        </center>
    </footer>

</body>
</html>
