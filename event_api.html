
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Event API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1, h2 {
            color: #234b75;
        }

        form, .event-list {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 9px 14px;
            margin: 5px 3px;
            border: none;
            border-radius: 4px;
            background-color: #234b75;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .delete-button {
            background-color: #b42318;
        }

        .message {
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #234b75;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>StudentHub Event Management</h1>

    <p id="message" class="message" aria-live="polite">
        Loading events...
    </p>

    <h2 id="form-title">Add New Event</h2>

    <form id="event-form">
        <input type="hidden" id="event_id">

        <label for="event_name">Event Name</label>
        <input type="text" id="event_name" maxlength="100" required>

        <label for="event_date">Event Date</label>
        <input type="date" id="event_date" required>

        <label for="venue">Venue</label>
        <input type="text" id="venue" maxlength="100" required>

        <label for="description">Description</label>
        <textarea id="description" rows="3"></textarea>

        <label for="status">Status</label>
        <select id="status" required>
            <option value="Upcoming">Upcoming</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
        </select>

        <button type="submit" id="save-button">Add Event</button>
        <button type="button" id="cancel-button" hidden>Cancel Edit</button>
    </form>

    <h2>All Events</h2>

    <div class="event-list">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Event Name</th>
                        <th>Date</th>
                        <th>Venue</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="event-table">
                    <tr>
                        <td colspan="7">Loading events...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const apiURL = "events_api.php";
const form = document.getElementById("event-form");
const message = document.getElementById("message");
const eventTable = document.getElementById("event-table");
const saveButton = document.getElementById("save-button");
const cancelButton = document.getElementById("cancel-button");

function showMessage(text, isError = false) {
    message.textContent = text;
    message.style.color = isError ? "#b42318" : "#176b35";
}

async function loadEvents() {
    eventTable.innerHTML =
        '<tr><td colspan="7">Loading events...</td></tr>';

    try {
        const response = await fetch(apiURL);
        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Unable to load events.");
        }

        eventTable.innerHTML = "";

        if (result.data.length === 0) {
            eventTable.innerHTML =
                '<tr><td colspan="7">No events found.</td></tr>';
        }

        result.data.forEach(function(item) {
            const row = document.createElement("tr");

            const values = [
                item.event_id,
                item.event_name,
                item.event_date,
                item.venue,
                item.description || "",
                item.status
            ];

            values.forEach(function(value) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actionCell = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.type = "button";
            editButton.textContent = "Edit";
            editButton.onclick = function() {
                editEvent(item);
            };

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-button";
            deleteButton.onclick = function() {
                deleteEvent(item.event_id);
            };

            actionCell.appendChild(editButton);
            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);
            eventTable.appendChild(row);
        });

        showMessage("Events loaded successfully.");
    } catch (error) {
        eventTable.innerHTML =
            '<tr><td colspan="7">Unable to load events.</td></tr>';
        showMessage(error.message, true);
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const eventId = document.getElementById("event_id").value;

    const data = {
        action: eventId ? "update" : "add",
        event_id: eventId,
        event_name: document.getElementById("event_name").value.trim(),
        event_date: document.getElementById("event_date").value,
        venue: document.getElementById("venue").value.trim(),
        description: document.getElementById("description").value.trim(),
        status: document.getElementById("status").value
    };

    saveButton.disabled = true;
    showMessage("Saving event...");

    try {
        const response = await fetch(apiURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Unable to save event.");
        }

        resetForm();
        await loadEvents();
        showMessage(result.message);
    } catch (error) {
        showMessage(error.message, true);
    } finally {
        saveButton.disabled = false;
    }
});

function editEvent(item) {
    document.getElementById("event_id").value = item.event_id;
    document.getElementById("event_name").value = item.event_name;
    document.getElementById("event_date").value = item.event_date;
    document.getElementById("venue").value = item.venue;
    document.getElementById("description").value = item.description || "";
    document.getElementById("status").value = item.status;

    document.getElementById("form-title").textContent = "Update Event";
    saveButton.textContent = "Update Event";
    cancelButton.hidden = false;

    window.scrollTo(0, 0);
    showMessage("Edit the details and click Update Event.");
}

async function deleteEvent(eventId) {
    if (!confirm("Are you sure you want to delete this event?")) {
        return;
    }

    showMessage("Deleting event...");

    try {
        const response = await fetch(apiURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "delete",
                event_id: eventId
            })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Unable to delete event.");
        }

        await loadEvents();
        showMessage(result.message);
    } catch (error) {
        showMessage(error.message, true);
    }
}

function resetForm() {
    form.reset();
    document.getElementById("event_id").value = "";
    document.getElementById("form-title").textContent = "Add New Event";
    saveButton.textContent = "Add Event";
    cancelButton.hidden = true;
}

cancelButton.addEventListener("click", resetForm);

loadEvents();
</script>
</body>
</html>
